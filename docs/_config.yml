title: Laravel Google Translate
description: "darvis/laravel-google-translate translates text, HTML and Eloquent models in a Laravel app with the Google Cloud Translation API, and keeps one row per locale linked through a pid column."
url: https://arviddejong.github.io
baseurl: /laravel-google-translate

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/laravel-google-translate
  repository: https://github.com/ArvidDeJong/laravel-google-translate
  packagist: https://packagist.org/packages/darvis/laravel-google-translate
  license_url: https://github.com/ArvidDeJong/laravel-google-translate/blob/main/LICENSE
  requires: "PHP 8.2+, Laravel 11, 12 or 13, a Google Cloud Translation API key"
  platforms: [Laravel]
  keywords: [laravel, google translate, google cloud translation, translation, i18n, localization, multilingual, eloquent, html translation]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/laravel-google-translate
  Packagist: https://packagist.org/packages/darvis/laravel-google-translate
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/laravel-google-translate
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
